name: Robotics Maintenance Automation

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run-robotics-maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests fastapi uvicorn

      - name: Start Factory API and run Robotics
        run: |
          set -e

          python -m uvicorn factory_API:app --host 127.0.0.1 --port 8000 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT

          python - <<'PY'
          import time
          import requests

          for attempt in range(30):
              try:
                  response = requests.get(
                      "http://127.0.0.1:8000/docs",
                      timeout=2
                  )
                  response.raise_for_status()
                  print("Factory API is ready")
                  break
              except requests.RequestException:
                  time.sleep(1)
          else:
              raise RuntimeError("Factory API failed to start")
          PY

          python robotics_maintenance.py
